services:
  web:
    environment:
      DATABASE_URL: postgresql://infinitus:infinitus@db:5432/infinitus?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: infinitus
      POSTGRES_USER: infinitus
      POSTGRES_PASSWORD: infinitus
    volumes:
      - local_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infinitus -d infinitus"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  local_postgres:
